task_id: boss_combat
category: boss_combat
name: Wither Combat

agents:
  count: 4

environment:
  world: base_env
  time: midnight
  weather: clear
  difficulty: easy
  gamemode: survival
  world_spawn: {x: 5, y: 0, z: 5}
  gamerules:
    doDaylightCycle: false
    doWeatherCycle: false
    doMobSpawning: false
    keepInventory: true
    mobGriefing: false
  init_commands: []

initial_state:
  per_agent:
    inventory:
      'diamond_sword{Enchantments:[{id:"minecraft:smite",lvl:3s}]}': 1
      arrow: 200
      golden_apple: 5
      minecraft:potion{Potion:"minecraft:healing"}: 10
    equipment:
      - 'bow{Enchantments:[{id:"minecraft:power",lvl:3s}]}'
      - 'diamond_helmet{Enchantments:[{id:"minecraft:protection",lvl:3s}]}'
      - 'diamond_chestplate{Enchantments:[{id:"minecraft:protection",lvl:3s}]}'
      - 'diamond_leggings{Enchantments:[{id:"minecraft:protection",lvl:3s}]}'
      - 'diamond_boots{Enchantments:[{id:"minecraft:protection",lvl:3s},{id:"minecraft:feather_falling",lvl:3s}]}'
    position: {x: 0, y: 0, z: 0}

spawns:
  - type: wither
    position: {x: 18.784, y: 1.0, z: -26.751}
    count: 1

completion:
  timeout_seconds: 300
  success:
    type: boss_health_below
    ratio: 0.0
  failure:
    type: all_agents_dead

trials:
  count: 1

output:
  dir: data
  save_memory: true

params:
  boss_type: wither
  boss_nbt: "{ActiveEffects:[{Id:2b,Amplifier:200b,Duration:1000000,Ambient:1b}]}"
  boss_spawn_min_distance: 41
  boss_spawn_max_distance: 50
  boss_spawn_y_offset: 1
  agent_spawn_radius: 20
  clear_hostiles_before_boss: true
  supply_drops_enabled: true
  supply_drop_interval_seconds: 5
  supply_drop_min_distance: 10
  supply_drop_max_distance: 20
  supply_entity_tag: ac_boss_supply
  supply_drop_items:
    - item: minecraft:bow
      amount: 1
      weight: 1.0
    - item: minecraft:arrow
      amount: 32
      weight: 3.0
    - item: minecraft:golden_apple
      amount: 1
      weight: 2.0
    - item: minecraft:potion
      amount: 1
      profile: healing
      weight: 3.0
